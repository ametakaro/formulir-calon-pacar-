<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada pertanyaan penting buat kamu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{--pink:#E8457A;--soft:#F7A8C2;--light:#FFE4EE;--dark:#5A2A3C}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:Poppins,system-ui,sans-serif;color:var(--dark);
    background:linear-gradient(160deg,#FFE4EE 0%,#FFD0E0 55%,#FFC2D6 100%);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;user-select:none}
  .wrap{position:relative;z-index:2;max-width:520px;width:100%}
  .face{font-size:84px;line-height:1;margin-bottom:6px;transition:transform .3s}
  h1{font-family:Pacifico,cursive;font-weight:400;color:var(--pink);font-size:clamp(28px,7vw,42px);margin:8px 0 6px;line-height:1.3}
  p.sub{margin:0 0 28px;font-size:15px;min-height:24px}
  .btns{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:90px}
  button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;transition:transform .15s,font-size .25s,padding .25s}
  #yes{background:var(--pink);color:#fff;padding:14px 34px;font-size:18px;box-shadow:0 8px 22px rgba(232,69,122,.4)}
  #yes:hover{transform:scale(1.06)}
  #no{background:#fff;color:var(--pink);border:2px solid var(--pink);padding:12px 28px;font-size:16px}
  #no.run{position:fixed;transition:left .25s ease,top .25s ease;z-index:5}
  .heart{position:fixed;pointer-events:none;color:var(--soft);animation:rise linear forwards;z-index:1}
  @keyframes rise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(25deg);opacity:.2}}
  .burst{position:fixed;pointer-events:none;z-index:10;animation:pop 1.6s ease-out forwards}
  @keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--r));opacity:0}}
  #yay{display:none}
  #yay .face{animation:beat 1s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.2)}40%{transform:scale(1)}60%{transform:scale(1.12)}}
  .wa{display:inline-block;margin-top:18px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:999px;box-shadow:0 8px 20px rgba(37,211,102,.35)}
  .small{font-size:12px;opacity:.7;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="ask">
  <div class="face" id="face">🥺</div>
  <h1>Mau jadi pacarku?</h1>
  <p class="sub" id="sub">Jawab jujur ya... aku udah deg-degan dari tadi.</p>
  <div class="btns">
    <button id="yes" type="button">Mau! 💕</button>
    <button id="no" type="button">Nggak</button>
  </div>
</div>

<div class="wrap" id="yay">
  <div class="face">🥰</div>
  <h1>YEAY! Resmi ya!</h1>
  <p class="sub">Mulai hari ini kamu pacarku. Nggak boleh ditarik lagi, udah tercatat di sistem. 😝</p>
  <a class="wa" id="wa" href="#" target="_blank" rel="noopener">Kabari aku di WhatsApp 💬</a>
  <div class="small">Tanggal jadian: <span id="date"></span></div>
</div>

<script>
  const WA_NUMBER = "6285381230405";
  const yes = document.getElementById("yes"), no = document.getElementById("no");
  const sub = document.getElementById("sub"), face = document.getElementById("face");
  const lines = [
    ["😳","Eh? Kayaknya kepencet ya?"],
    ["🥺","Coba dipikir lagi deh..."],
    ["😢","Yakin? Aku udah siapin banyak jajan loh"],
    ["😭","Tombol itu rusak kayaknya, coba yang pink"],
    ["🙏","Aku janji balas chat cepet deh"],
    ["😤","Udah, tombol 'Nggak' itu nggak berlaku di sini"],
    ["🫠","Hatiku retak dikit... tapi masih bisa diperbaiki kalau kamu klik 'Mau'"],
    ["🤭","Kamu cuma pengen lihat tombolnya kabur kan?"]
  ];
  let tries = 0, yesSize = 18;

  function dodge(e){
    if (e) e.preventDefault();
    tries++;
    const [f, t] = lines[(tries - 1) % lines.length];
    face.textContent = f; sub.textContent = t;
    yesSize = Math.min(yesSize + 4, 48);
    yes.style.fontSize = yesSize + "px";
    yes.style.padding = (14 + tries*2) + "px " + (34 + tries*4) + "px";
    no.classList.add("run");
    const r = no.getBoundingClientRect();
    const maxX = window.innerWidth - r.width - 12, maxY = window.innerHeight - r.height - 12;
    const y = yes.getBoundingClientRect();
    let x, yy, guard = 0;
    do {
      x = 12 + Math.random() * Math.max(0, maxX - 12);
      yy = 12 + Math.random() * Math.max(0, maxY - 12);
      guard++;
    } while (guard < 30 && x < y.right + 20 && x + r.width > y.left - 20 && yy < y.bottom + 20 && yy + r.height > y.top - 20);
    no.style.left = x + "px"; no.style.top = yy + "px";
    if (tries >= 10) { no.textContent = "Nggak bisa 😜"; }
  }
  no.addEventListener("mouseenter", dodge);
  no.addEventListener("touchstart", dodge, {passive:false});
  no.addEventListener("click", dodge);

  function floatHeart(){
    const h = document.createElement("div"); h.className = "heart"; h.textContent = "❤";
    h.style.left = Math.random()*100 + "vw"; h.style.top = "102vh";
    h.style.fontSize = (12 + Math.random()*22) + "px";
    h.style.animationDuration = (7 + Math.random()*7) + "s";
    document.body.append(h); setTimeout(() => h.remove(), 15000);
  }
  setInterval(floatHeart, 600);

  function burst(){
    const em = ["💖","💕","💗","🌸","✨","🥰","💘"];
    for (let i = 0; i < 70; i++) {
      const b = document.createElement("div"); b.className = "burst";
      b.textContent = em[i % em.length];
      b.style.left = "50vw"; b.style.top = "45vh";
      b.style.fontSize = (16 + Math.random()*22) + "px";
      const a = Math.random()*Math.PI*2, d = 120 + Math.random()*Math.max(window.innerWidth, window.innerHeight)*0.55;
      b.style.setProperty("--dx", Math.cos(a)*d + "px");
      b.style.setProperty("--dy", Math.sin(a)*d + "px");
      b.style.setProperty("--r", (Math.random()*720 - 360) + "deg");
      document.body.append(b); setTimeout(() => b.remove(), 1700);
    }
  }

  yes.addEventListener("click", () => {
    document.getElementById("ask").style.display = "none";
    no.style.display = "none";
    document.getElementById("yay").style.display = "block";
    const today = new Date().toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
    document.getElementById("date").textContent = today;
    const msg = "Aku udah jawab: MAU! 💕 Mulai " + today + " kita resmi ya 🥰" + (tries ? " (tadi sempat nyoba klik 'Nggak' " + tries + "x, maaf 🤭)" : "");
    document.getElementById("wa").href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(msg);
    burst(); setTimeout(burst, 500); setTimeout(burst, 1000);
    for (let i = 0; i < 25; i++) setTimeout(floatHeart, i * 60);
  });
</script>
</body>
</html>
