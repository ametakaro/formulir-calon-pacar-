<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada surat buat kamu 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--pink:#E8457A;--soft:#F7A8C2;--light:#FFE4EE;--dark:#5A2A3C;--paper:#FFFDF8;--env:#F4B6C9;--env2:#EFA0B8}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:Poppins,system-ui,sans-serif;color:var(--dark);overflow-x:hidden;
    background:linear-gradient(160deg,#FFE4EE,#FFC9DA);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 16px}
  .hint{font-family:Pacifico,cursive;color:var(--pink);font-size:clamp(22px,6vw,30px);margin:0 0 26px;text-align:center;transition:opacity .5s}
  .hint small{display:block;font-family:Poppins;font-size:13px;color:var(--dark);opacity:.7;margin-top:6px}

  /* envelope */
  .scene{position:relative;width:min(340px,88vw);aspect-ratio:3/2;cursor:pointer;transition:transform .6s ease,opacity .6s ease}
  .scene:hover{transform:translateY(-4px) rotate(-1deg)}
  .scene.wiggle{animation:wiggle 2.4s ease-in-out infinite}
  @keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-3deg)}88%{transform:rotate(3deg)}92%{transform:rotate(-2deg)}96%{transform:rotate(1deg)}}
  .env-back{position:absolute;inset:0;background:var(--env2);border-radius:10px;box-shadow:0 18px 40px rgba(232,69,122,.3)}
  .peek{position:absolute;left:7%;right:7%;top:8%;bottom:8%;background:var(--paper);border-radius:6px;transition:transform .8s ease .5s;z-index:1}
  .env-front{position:absolute;inset:0;z-index:3;border-radius:10px;overflow:hidden;pointer-events:none}
  .env-front:before{content:"";position:absolute;left:0;bottom:0;border-left:calc(min(340px,88vw)/2) solid var(--env);border-right:calc(min(340px,88vw)/2) solid var(--env);border-top:calc(min(340px,88vw)/3) solid transparent;border-bottom:calc(min(340px,88vw)/3) solid var(--env)}
  .flap{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;transform-origin:top;transition:transform .6s ease,z-index 0s .3s}
  .flap:before{content:"";position:absolute;left:0;top:0;border-left:calc(min(340px,88vw)/2) solid transparent;border-right:calc(min(340px,88vw)/2) solid transparent;border-top:calc(min(340px,88vw)/3 + 6px) solid #F7C3D3;filter:drop-shadow(0 3px 2px rgba(0,0,0,.08))}
  .seal{position:absolute;left:50%;top:calc(min(340px,88vw)/3 - 22px);transform:translateX(-50%);z-index:5;width:50px;height:50px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f06b95,#c92c5e);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;
    box-shadow:0 3px 8px rgba(0,0,0,.25);transition:opacity .3s,transform .3s}
  .to{position:absolute;bottom:14%;left:0;right:0;text-align:center;z-index:6;font-family:Caveat,cursive;font-size:26px;color:var(--dark);pointer-events:none}
  .scene.open .seal{opacity:0;transform:translateX(-50%) scale(.3)}
  .scene.open .flap{transform:rotateX(180deg);z-index:0}
  .scene.open .peek{transform:translateY(-40%)}
  .scene.gone{opacity:0;transform:translateY(60px) scale(.85);pointer-events:none}

  /* letter */
  .letter{display:none;position:relative;width:min(560px,94vw);background:var(--paper);border-radius:14px;padding:36px 30px 30px;
    box-shadow:0 20px 50px rgba(232,69,122,.25);opacity:0;transform:translateY(30px) scale(.97);transition:all .8s ease;
    background-image:repeating-linear-gradient(transparent 0 35px,#f6dbe4 35px 36px);background-position:0 70px}
  .letter.show{opacity:1;transform:none}
  .letter:before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:#f7c3d3}
  .tape{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-2deg);width:110px;height:26px;background:rgba(247,168,194,.6);border-radius:3px}
  #text{font-family:Caveat,cursive;font-size:clamp(22px,5.2vw,27px);line-height:36px;white-space:pre-wrap;min-height:200px;margin:0;padding-left:8px}
  .caret{display:inline-block;width:2px;height:24px;background:var(--pink);vertical-align:-4px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .actions{display:none;margin-top:22px;text-align:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .actions.show{display:flex;animation:fade .8s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}}
  .btn{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;text-decoration:none;display:inline-block}
  .wa{background:#25D366;color:#fff;box-shadow:0 6px 16px rgba(37,211,102,.35)}
  .ghost{background:#fff;color:var(--pink);border:2px solid var(--pink)}
  .skip{position:absolute;top:10px;right:14px;font-size:12px;color:var(--pink);background:none;border:0;cursor:pointer;font-family:inherit;opacity:.7}
  .petal{position:fixed;top:-30px;pointer-events:none;z-index:0;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
</style>
</head>
<body>
  <p class="hint" id="hint">Ada surat buat kamu 💌<small>ketuk amplopnya untuk membuka</small></p>

  <div class="scene wiggle" id="env" role="button" tabindex="0" aria-label="Buka amplop">
    <div class="env-back"></div>
    <div class="peek"></div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <div class="seal">❤</div>
    <div class="to">untuk kamu</div>
  </div>

  <div class="letter" id="letter">
    <div class="tape"></div>
    <button class="skip" id="skip" type="button">lewati animasi »</button>
    <p id="text"></p>
    <div class="actions" id="actions">
      <a class="btn wa" id="wa" href="#" target="_blank" rel="noopener">Balas suratku 💬</a>
      <button class="btn ghost" id="again" type="button">Baca lagi</button>
    </div>
  </div>

<script>
  const WA_NUMBER = "6285381230405";
  const LETTER =
`Hai kamu,

Aku nggak tahu harus mulai dari mana, jadi aku tulis aja ya.

Akhir-akhir ini ada satu hal yang sering banget muncul di kepalaku, dan ternyata itu kamu. Pas lagi bengong, pas dengerin lagu, bahkan pas lagi makan mie tengah malam.

Aku suka cara kamu ketawa. Aku suka cerita-cerita random kamu. Aku juga suka gimana hariku jadi lebih seru tiap ada notif dari kamu, walaupun isinya cuma "wkwk".

Aku nggak minta apa-apa yang ribet kok. Aku cuma pengen kamu tahu: kamu itu spesial buat aku.

Jadi... kalau kamu juga ngerasain hal yang sama, balas surat ini ya. Kalau belum, nggak apa-apa, aku tetap senang bisa kenal kamu. 🤍

Dengan hati yang lagi deg-degan,
aku`;

  const env = document.getElementById("env"), letter = document.getElementById("letter");
  const textEl = document.getElementById("text"), actions = document.getElementById("actions");
  let typing = null, i = 0, opened = false;

  function petals(n){
    const em = ["🌸","💗","💕","🤍"];
    for (let k = 0; k < n; k++) setTimeout(() => {
      const p = document.createElement("div"); p.className = "petal"; p.textContent = em[k % em.length];
      p.style.left = Math.random()*100 + "vw"; p.style.fontSize = (14 + Math.random()*16) + "px";
      p.style.animationDuration = (5 + Math.random()*5) + "s";
      document.body.append(p); setTimeout(() => p.remove(), 11000);
    }, k * 120);
  }

  function render(){
    textEl.textContent = LETTER.slice(0, i);
    const c = document.createElement("span"); c.className = "caret"; textEl.append(c);
  }
  function type(){
    if (i >= LETTER.length) return finish();
    i++; render();
    const ch = LETTER[i-1];
    const delay = ch === "\n" ? 280 : /[.,!?]/.test(ch) ? 220 : 32 + Math.random()*35;
    typing = setTimeout(type, delay);
  }
  function finish(){
    clearTimeout(typing); i = LETTER.length; textEl.textContent = LETTER;
    document.getElementById("skip").style.display = "none";
    actions.classList.add("show"); petals(30);
  }
  function start(){
    i = 0; actions.classList.remove("show");
    document.getElementById("skip").style.display = "block";
    clearTimeout(typing); type();
  }

  function open(){
    if (opened) return; opened = true;
    env.classList.remove("wiggle"); env.classList.add("open");
    document.getElementById("hint").style.opacity = 0;
    setTimeout(() => env.classList.add("gone"), 1400);
    setTimeout(() => {
      env.style.display = "none"; document.getElementById("hint").style.display = "none";
      letter.style.display = "block";
      requestAnimationFrame(() => requestAnimationFrame(() => letter.classList.add("show")));
      setTimeout(start, 700);
    }, 2000);
  }
  env.addEventListener("click", open);
  env.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") open(); });
  document.getElementById("skip").addEventListener("click", finish);
  document.getElementById("again").addEventListener("click", () => { window.scrollTo(0,0); start(); });
  document.getElementById("wa").href = "https://wa.me/" + WA_NUMBER + "?text=" +
    encodeURIComponent("Aku udah baca suratmu 💌 ...dan aku juga ngerasain hal yang sama 🥰");
</script>
</body>
</html>
