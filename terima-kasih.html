<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamaran Terkirim</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFE4EE;--card:#FFFFFF;--ink:#5A2A3C;--muted:#9A6A7E;--pink:#E8457A;--soft:#F7A8C2;--butter:#FFE9A8;
    --display:"Pacifico",cursive;--body:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){:root{--bg:#2A1520;--card:#3A1E2C;--ink:#FFE4EE;--muted:#D9A9BC;--pink:#FF6B98;--soft:#8A3E5C;--butter:#5C4A1E;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;min-height:100vh;
    display:grid;place-items:center;padding:36px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));overflow-x:hidden}
  .poster{position:relative;z-index:1;max-width:520px;width:100%;background:var(--card);border:3px solid var(--ink);border-radius:28px;
    padding:36px 24px 28px;box-shadow:8px 8px 0 var(--pink);text-align:center}
  .tape{position:absolute;top:-15px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--butter);border:2px solid var(--ink);
    padding:3px 16px;border-radius:6px;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .mascot{display:block;margin:0 auto;width:90px;animation:beat 1.3s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
  h1{font-family:var(--display);font-weight:400;color:var(--pink);font-size:clamp(28px,8vw,38px);margin:10px 0 8px;line-height:1.25}
  p{margin:0 auto 12px;max-width:40ch}
  .no{color:var(--muted);font-size:14px}
  .btn{display:inline-block;margin-top:14px;padding:13px 26px;border:3px solid var(--ink);border-radius:999px;background:var(--card);color:var(--pink);
    font-weight:700;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
  :focus-visible{outline:3px dashed var(--pink);outline-offset:3px}
  .confetti{position:fixed;top:-30px;pointer-events:none;z-index:20;font-size:22px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
  @media (prefers-reduced-motion:reduce){.mascot{animation:none}.confetti{display:none}}
</style>
</head>
<body>
<main class="poster">
  <div class="tape">Diterima HRD Hati</div>
  <svg class="mascot" viewBox="0 0 100 90" aria-hidden="true">
    <path d="M50 86 C20 64 4 48 4 28 C4 14 15 4 28 4 C38 4 46 10 50 18 C54 10 62 4 72 4 C85 4 96 14 96 28 C96 48 80 64 50 86Z" fill="var(--pink)" stroke="var(--ink)" stroke-width="5"/>
    <path d="M30 38 Q36 32 42 38 M58 38 Q64 32 70 38" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 50 Q50 64 62 50" fill="var(--ink)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="26" cy="50" r="5" fill="var(--soft)"/><circle cx="74" cy="50" r="5" fill="var(--soft)"/>
  </svg>
  <h1>Lamaran terkirim!</h1>
  <p>Lamaranmu sudah sampai di meja HRD Hati. Hasil seleksi akan diumumkan secara pribadi. Deg-degan ya? 😉</p>
  <p class="no" id="no" hidden>Nomor lamaran: <b id="ticket"></b></p>
  <a class="btn" href="./">Kembali ke formulir</a>
</main>
<script>
  const no = new URLSearchParams(location.search).get("no");
  if (no && /^CP-[A-Z0-9]{1,8}$/.test(no)) { document.getElementById("ticket").textContent = no; document.getElementById("no").hidden = false; }
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const bits = ["💖","💕","✨","💗","🌸"];
    for (let k = 0; k < 40; k++) {
      const c = document.createElement("div"); c.className = "confetti"; c.textContent = bits[k % bits.length];
      c.style.left = Math.random() * 100 + "vw"; c.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      c.style.animationDelay = Math.random() * .8 + "s"; document.body.append(c); setTimeout(() => c.remove(), 6000);
    }
  }
</script>
</body>
</html>
